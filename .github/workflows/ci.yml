name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haircraft360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      # Fake values only. CI never talks to Paystack, Resend or a real database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haircraft360_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/haircraft360_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haircraft360_test
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      CRON_SECRET: ci-only-cron-secret
      EMAIL_TRANSPORT: console
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build
