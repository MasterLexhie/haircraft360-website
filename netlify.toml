# Netlify build settings (docs/DEPLOY_STAGING.md). The same file serves staging and production;
# only the environment variables differ. Netlify detects Next.js and runs it through its adapter.
# The functions region is set in the Netlify UI (Project configuration), not here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
